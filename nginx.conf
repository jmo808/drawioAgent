events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Upstream definitions
    upstream drawio_frontend {
        server drawio-frontend:8080;
    }

    upstream drawio_api {
        server drawio-api:3000;
    }

    upstream drawio_agent {
        server drawio-agent:8000;
    }

    server {
        listen 8080;
        server_name localhost;
        port_in_redirect off;
        absolute_redirect off;

        # Redirect root to draw.io app
        location = / {
            return 301 /draw/$is_args$args;
        }

        # WebSocket support headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Route /api/v1/providers to agent service
        location = /api/v1/providers {
            proxy_pass http://drawio_agent;
        }

        # WebSocket chat route
        location /api/v1/ws/ {
            proxy_pass http://drawio_api;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Fastify API routes
        location /api/ {
            proxy_pass http://drawio_api;
        }

        # Mock Draw.io endpoints to prevent 404s in air-gapped environments
        location ~ ^/(?:draw/)?cache$ {
            default_type text/plain;
            return 200 "ok";
        }

        location ~ ^/(?:draw/)?notifications$ {
            default_type application/json;
            return 200 "[]";
        }

        # Draw.io frontend editor routes
        location / {
            proxy_pass http://drawio_frontend;
        }
    }
}

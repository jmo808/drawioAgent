name: End-to-End Testing

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 2 * * 0' # Weekly on Sundays at 02:00 UTC

jobs:
  e2e:
    name: K8s E2E Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agent Repository
        uses: actions/checkout@v7.0.1
        with:
          path: drawioAgent

      - name: Checkout Plugin Repository
        uses: actions/checkout@v7.0.1
        with:
          repository: jmo808/drawio_plugin
          path: drawio_plugin

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Install Playwright Dependencies
        run: |
          cd drawioAgent
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Create Kind Cluster
        run: |
          # Delete existing cluster if left over
          kind delete cluster --name drawio-e2e || true
          kind create cluster --config drawioAgent/.github/kind-config.yaml --name drawio-e2e

      - name: Apply Gateway API CRDs
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml

      - name: Install Cilium CLI
        run: |
          CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
          CLI_ARCH=amd64
          if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
          curl -L --fail https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz | tar xz -C /tmp
          sudo mv /tmp/cilium /usr/local/bin/

      - name: Install Cilium CNI
        run: |
          cilium install --version 1.16.0 --set gatewayAPI.enabled=true
          kubectl wait --namespace kube-system \
            --for=condition=ready pod \
            --selector=k8s-app=cilium \
            --timeout=120s

      - name: Build Service Docker Images
        run: |
          docker build -t drawio-frontend:local -f drawioAgent/frontend/sidebar/Dockerfile drawioAgent
          docker build -t drawio-api:local -f drawioAgent/services/api/Dockerfile drawioAgent
          docker build -t drawio-agent:local -f drawioAgent/services/agent/Dockerfile .

      - name: Load Images into Kind
        run: |
          kind load docker-image drawio-frontend:local --name drawio-e2e
          kind load docker-image drawio-api:local --name drawio-e2e
          kind load docker-image drawio-agent:local --name drawio-e2e

      - name: Deploy drawio-agent Helm Chart
        run: |
          helm install drawio-agent drawioAgent/chart/drawio-agent \
            --set agent.env.MOCK_LLM=true \
            --set agent.image.repository=drawio-agent \
            --set agent.image.tag=local \
            --set api.image.repository=drawio-api \
            --set api.image.tag=local \
            --set frontend.image.repository=drawio-frontend \
            --set frontend.image.tag=local \
            --set collaboration.enabled=true \
            --set collaboration.valkey.enabled=true \
            --wait --timeout 180s

      - name: Setup Port Forwarding
        run: |
          # Find gateway or frontend service and port-forward to localhost:8081
          GW_SVC=$(kubectl get svc -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep -E "gateway|frontend" | head -n 1)
          echo "Port forwarding service '$GW_SVC' to localhost:8081..."
          kubectl port-forward svc/$GW_SVC 8081:8080 & || kubectl port-forward svc/$GW_SVC 8081:80 &
          # Port forward the API service and Agent service for integration tests
          kubectl port-forward svc/drawio-agent-api 3000:3000 &
          kubectl port-forward svc/drawio-agent-agent 8000:8000 &
          # Give it a moment to establish connection
          sleep 5

      - name: Run Playwright E2E Tests
        run: |
          cd drawioAgent
          npx playwright test -c tests/e2e/playwright.config.ts

      - name: Collect Playwright Report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: playwright-report
          path: drawioAgent/playwright-report/

      - name: Cleanup Kind Cluster
        if: always()
        run: |
          kind delete cluster --name drawio-e2e

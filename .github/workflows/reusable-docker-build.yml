name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      context-path:
        required: true
        type: string
      dockerfile-path:
        required: true
        type: string
      platforms:
        required: false
        type: string
        default: 'linux/amd64'
      push:
        required: false
        type: boolean
        default: false
      tags:
        required: true
        type: string
    outputs:
      image-digest:
        description: "The built image digest"
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup QEMU (for Multi-Arch Builds)
        if: ${{ inputs.push }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.6.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0

      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        id: build-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: ${{ inputs.context-path }}
          file: ${{ inputs.dockerfile-path }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

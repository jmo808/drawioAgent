name: Release & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write

jobs:
  build-and-push:
    name: Build & Push Service Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, api, agent]
        include:
          - service: frontend
            context: drawioAgent
            file: drawioAgent/frontend/sidebar/Dockerfile
            image_name: drawio-frontend
          - service: api
            context: drawioAgent
            file: drawioAgent/services/api/Dockerfile
            image_name: drawio-api
          - service: agent
            context: .
            file: drawioAgent/services/agent/Dockerfile
            image_name: drawio-agent
    steps:
      - name: Checkout Agent Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: drawioAgent

      - name: Checkout Plugin Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: jmo808/drawio_plugin
          path: drawio_plugin

      - name: Extract Tag Info
        id: tag-info
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          SEMVER=${VERSION#v}
          echo "semver=${SEMVER}" >> $GITHUB_OUTPUT

      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.6.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Service Image
        id: build-service
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: 'linux/amd64,linux/arm64'
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:${{ steps.tag-info.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan-and-sign:
    name: Security Scan & Sign Images
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, api, agent]
        include:
          - service: frontend
            image_name: drawio-frontend
          - service: api
            image_name: drawio-api
          - service: agent
            image_name: drawio-agent
    steps:
      - name: Extract Tag Info
        id: tag-info
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:${{ steps.tag-info.outputs.version }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          trivy-version: '0.60.0'

      - name: Upload Trivy Scan Results to Security Tab
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.30.3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.8.1

      - name: Sign Image
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:${{ steps.tag-info.outputs.version }}"

  publish-chart:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Extract Tag Info
        id: tag-info
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          SEMVER=${VERSION#v}
          echo "semver=${SEMVER}" >> $GITHUB_OUTPUT

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.0

      - name: Update Chart Version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.tag-info.outputs.semver }}/g" chart/drawio-agent/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.tag-info.outputs.version }}\"/g" chart/drawio-agent/Chart.yaml

      - name: Package Helm Chart
        run: helm package chart/drawio-agent --destination .

      - name: Login to GHCR OCI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Helm Chart OCI
        run: helm push drawio-agent-${{ steps.tag-info.outputs.semver }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  github-release:
    name: Create GitHub Release
    needs: [build-and-push, scan-and-sign, publish-chart]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Extract Tag Info
        id: tag-info
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.2.1
        with:
          name: Release ${{ steps.tag-info.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: "true"
          body: |
            ## Draw.io Agent Release ${{ steps.tag-info.outputs.version }}

            All services and Helm charts have been built, vulnerability scanned, and signed successfully.

            ### Published Container Images
            - **Frontend**: `ghcr.io/${{ github.repository_owner }}/drawio-frontend:${{ steps.tag-info.outputs.version }}`
            - **API Server**: `ghcr.io/${{ github.repository_owner }}/drawio-api:${{ steps.tag-info.outputs.version }}`
            - **Agent Service**: `ghcr.io/${{ github.repository_owner }}/drawio-agent:${{ steps.tag-info.outputs.version }}`

            ### Helm Chart (OCI Artifact)
            `oci://ghcr.io/${{ github.repository_owner }}/charts/drawio-agent` version `${{ steps.tag-info.outputs.version }}`

            ### Container Image Verification
            Images can be verified using `cosign`:
            ```bash
            cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.github/workflows/release.yml@refs/tags/${{ steps.tag-info.outputs.version }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ghcr.io/${{ github.repository_owner }}/drawio-api:${{ steps.tag-info.outputs.version }}
            ```

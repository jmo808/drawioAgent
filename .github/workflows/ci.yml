name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint & Style Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Root Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Install Python Linting Tools
        run: pip install ruff

      - name: Run Ruff
        run: ruff check .

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.0

      - name: Run Helm Lint
        run: helm lint --strict chart/drawio-agent

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Type Check
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Root Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TS Unit Tests (with Coverage)
        run: npm run test -- --coverage --run

      - name: Install Python Dependencies
        run: |
          cd services/agent
          pip install -r requirements.txt pytest pytest-cov

      - name: Run Python Unit Tests (with Coverage)
        run: |
          cd services/agent
          pytest --cov=src --cov-fail-under=80 --cov-report=term-missing tests/

  trivy-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Run Trivy Vulnerability Scanner (Digest Pinned)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            docker.io/aquasec/trivy@sha256:91c3a842834563a6860dbaec5af7c1949df5caf988f9632ef5cbb0a5cd59d8f8 \
            fs \
            --format sarif \
            --output /workspace/trivy-results.sarif \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /workspace

      - name: Upload Trivy Scan Results (Artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        if: always()
        with:
          name: trivy-fs-results
          path: trivy-results.sarif

      - name: Upload Trivy Scan Results to Security Tab
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.30.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'

  docker-build-verify:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agent Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: drawioAgent

      - name: Checkout Plugin Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: jmo808/drawio_plugin
          path: drawio_plugin

      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            shared:
              - 'drawioAgent/packages/shared/**'
            frontend:
              - 'drawioAgent/frontend/sidebar/**'
              - 'drawioAgent/packages/shared/**'
            api:
              - 'drawioAgent/services/api/**'
              - 'drawioAgent/packages/shared/**'
            agent:
              - 'drawioAgent/services/agent/**'
              - 'drawioAgent/packages/shared/**'

      - name: Setup Docker Buildx
        if: steps.filter.outputs.frontend == 'true' || steps.filter.outputs.api == 'true' || steps.filter.outputs.agent == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0

      - name: Build Frontend (Verify)
        if: steps.filter.outputs.frontend == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: drawioAgent
          file: drawioAgent/frontend/sidebar/Dockerfile
          push: false
          tags: drawio-frontend:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API Server (Verify)
        if: steps.filter.outputs.api == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: drawioAgent
          file: drawioAgent/services/api/Dockerfile
          push: false
          tags: drawio-api:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Agent (Verify)
        if: steps.filter.outputs.agent == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: .
          file: drawioAgent/services/agent/Dockerfile
          push: false
          tags: drawio-agent:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

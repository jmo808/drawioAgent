name: Cleanup GHCR Packages

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete drawio-frontend versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'drawio-frontend'
          package-type: 'container'
          min-versions-to-keep: 0

      - name: Delete drawio-api versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'drawio-api'
          package-type: 'container'
          min-versions-to-keep: 0

      - name: Delete drawio-agent versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'drawio-agent'
          package-type: 'container'
          min-versions-to-keep: 0

      - name: Delete chart versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'charts%2Fdrawio-agent'
          package-type: 'container'
          min-versions-to-keep: 0

      - name: REST API Package Cleanup Fallback
        continue-on-error: true
        run: |
          for pkg in drawio-frontend drawio-api drawio-agent charts%2Fdrawio-agent drawio-agent-chart; do
            echo "Listing versions for $pkg..."
            VERSIONS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/${{ github.repository_owner }}/packages/container/$pkg/versions" | jq -r '.[].id // empty' 2>/dev/null || true)
            for vid in $VERSIONS; do
              echo "Deleting $pkg version $vid..."
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/users/${{ github.repository_owner }}/packages/container/$pkg/versions/$vid" || true
            done
          done

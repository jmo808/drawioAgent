{{- if .Values.alerting.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "drawio-agent.fullname" . }}
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
spec:
  groups:
    - name: drawio-agent.rules
      rules:
        - alert: DrawIOAgentDown
          expr: up{job="drawio-agent-agent"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "DrawIO Agent service is down"
            description: "The Python AI Agent service pod has been down for more than 5 minutes."

        - alert: HighLLMErrorRate
          expr: rate(mcp_tool_calls_total{status="error"}[5m]) / rate(mcp_tool_calls_total[5m]) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High LLM/MCP error rate"
            description: "Over 50% of MCP tool calls have failed in the last 5 minutes."

        - alert: LLMCircuitOpen
          expr: llm_circuit_state > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "LLM Provider Circuit Breaker is open"
            description: "The circuit breaker for an LLM provider has tripped and is currently open."

        - alert: HighAPILatency
          expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High API Server HTTP latency"
            description: "The p99 latency of HTTP requests is above 10 seconds for more than 5 minutes."

        - alert: WebSocketConnectionsDrop
          expr: delta(ws_connections_active[5m]) < -0.5 * (ws_connections_active offset 5m)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "WebSocket connections dropped significantly"
            description: "More than 50% of active WebSocket connections have dropped over the last 5 minutes."

        - alert: HighMemoryUsage
          expr: container_memory_working_set_bytes / container_spec_memory_limit_bytes > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High container memory usage"
            description: "Container memory usage is above 90% of the spec limit for more than 5 minutes."
{{- end -}}

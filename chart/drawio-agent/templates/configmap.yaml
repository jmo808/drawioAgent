apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "drawio-agent.fullname" . }}-config
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
data:
  AGENT_SERVICE_URL: "http://{{ include "drawio-agent.fullname" . }}-agent:8000"
  API_PORT: "3000"
  FRONTEND_PORT: "8080"
  AUTH_PROVIDER: {{ .Values.auth.provider | quote }}
  AUTH_JWKS_URI: {{ .Values.auth.jwksUri | quote }}
  AUTH_ISSUER: {{ .Values.auth.issuer | quote }}
  AUTH_AUDIENCE: {{ .Values.auth.audience | quote }}
  COLLABORATION_ENABLED: {{ .Values.collaboration.enabled | quote }}
  VALKEY_HOST: {{ if .Values.collaboration.valkey.enabled }}{{ printf "%s-valkey" (include "drawio-agent.fullname" .) | quote }}{{ else }}{{ .Values.collaboration.valkey.host | quote }}{{ end }}
  VALKEY_PORT: {{ if .Values.collaboration.valkey.enabled }}"6379"{{ else }}{{ .Values.collaboration.valkey.port | quote }}{{ end }}

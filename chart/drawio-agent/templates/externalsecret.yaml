{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "drawio-agent.fullname" . }}-secrets
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecret.secretStoreRef.name | default "external-secret-store" }}
  target:
    name: {{ include "drawio-agent.fullname" . }}-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        api-key: {{ .Values.global.apiKey | quote }}
        llm-provider: {{ .Values.agent.llm.provider | quote }}
        llm-model: {{ .Values.agent.llm.model | quote }}
        llm-api-key: "{{ `{{ .gemini_key }}` }}"
  data:
  - secretKey: gemini_key
    remoteRef:
      key: {{ .Values.externalSecret.remoteKey | default "llm-api-key" }}
{{- end }}

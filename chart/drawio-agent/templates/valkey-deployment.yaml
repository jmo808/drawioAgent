{{- if and .Values.collaboration.enabled .Values.collaboration.valkey.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drawio-agent.fullname" . }}-valkey
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "drawio-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        {{- include "drawio-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: valkey
    spec:
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8
          imagePullPolicy: IfNotPresent
          args:
            {{- if .Values.collaboration.persistence.enabled }}
            - --save
            - {{ .Values.collaboration.persistence.saveIntervals | quote }}
            {{- else }}
            - --save
            - ""
            {{- end }}
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          {{- if .Values.collaboration.persistence.enabled }}
          volumeMounts:
            - name: valkey-data
              mountPath: /data
          {{- end }}
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
      {{- if .Values.collaboration.persistence.enabled }}
      volumes:
        - name: valkey-data
          persistentVolumeClaim:
            claimName: {{ include "drawio-agent.fullname" . }}-valkey-data
      {{- end }}
{{- end }}

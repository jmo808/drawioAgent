apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drawio-agent.fullname" . }}-api
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "drawio-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "drawio-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-secrets
                  key: api-key
            - name: AGENT_SERVICE_URL
              value: "http://{{ include "drawio-agent.fullname" . }}-agent:8000"
            - name: AUTH_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-config
                  key: AUTH_PROVIDER
            - name: AUTH_JWKS_URI
              valueFrom:
                configMapKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-config
                  key: AUTH_JWKS_URI
            - name: AUTH_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-config
                  key: AUTH_ISSUER
            - name: AUTH_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-config
                  key: AUTH_AUDIENCE
            - name: COLLABORATION_ENABLED
              value: {{ .Values.collaboration.enabled | quote }}
            {{- if .Values.collaboration.enabled }}
            - name: VALKEY_HOST
              value: {{ if .Values.collaboration.valkey.enabled }}{{ printf "%s-valkey" (include "drawio-agent.fullname" .) | quote }}{{ else }}{{ .Values.collaboration.valkey.host | quote }}{{ end }}
            - name: VALKEY_PORT
              value: {{ if .Values.collaboration.valkey.enabled }}"6379"{{ else }}{{ .Values.collaboration.valkey.port | quote }}{{ end }}
            {{- if .Values.collaboration.valkey.password }}
            - name: VALKEY_PASSWORD
              value: {{ .Values.collaboration.valkey.password | quote }}
            {{- else if .Values.collaboration.valkey.existingSecret }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.collaboration.valkey.existingSecret }}
                  key: {{ .Values.collaboration.valkey.existingSecretKey | default "password" }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

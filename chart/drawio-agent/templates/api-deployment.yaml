apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drawio-agent.fullname" . }}-api
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "drawio-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      {{- if .Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
      {{- end }}
      labels:
        {{- include "drawio-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}{{ if .Values.api.image.digest }}@{{ .Values.api.image.digest }}{{ else }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-secrets
                  key: api-key
            - name: AGENT_SERVICE_URL
              value: "http://{{ include "drawio-agent.fullname" . }}-agent:8000"
            - name: AUTH_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-config
                  key: AUTH_PROVIDER
            - name: AUTH_JWKS_URI
              valueFrom:
                configMapKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-config
                  key: AUTH_JWKS_URI
            - name: AUTH_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-config
                  key: AUTH_ISSUER
            - name: AUTH_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-config
                  key: AUTH_AUDIENCE
            - name: AUTH_CALLBACK_URI
              valueFrom:
                configMapKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-config
                  key: AUTH_CALLBACK_URI
            - name: AUTH_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-config
                  key: AUTH_REDIRECT_URI
            - name: AUTH_INTERNAL_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-config
                  key: AUTH_INTERNAL_ISSUER
            - name: AUTH_TRUSTED_ISSUER_PATTERNS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-config
                  key: AUTH_TRUSTED_ISSUER_PATTERNS
            - name: COLLABORATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-config
                  key: COLLABORATION_ENABLED
            - name: VALKEY_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-config
                  key: VALKEY_HOST
            - name: VALKEY_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-config
                  key: VALKEY_PORT
            {{- if .Values.collaboration.enabled }}
            {{- if .Values.collaboration.valkey.password }}
            - name: VALKEY_PASSWORD
              value: {{ .Values.collaboration.valkey.password | quote }}
            {{- else if .Values.collaboration.valkey.existingSecret }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.collaboration.valkey.existingSecret }}
                  key: {{ .Values.collaboration.valkey.existingSecretKey | default "password" }}
            {{- end }}
            {{- end }}
            {{- if .Values.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.otlpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "{{ include "drawio-agent.fullname" . }}-api"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

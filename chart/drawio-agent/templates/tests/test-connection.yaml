apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "drawio-agent.fullname" . }}-test-connection"
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args:
        - '--spider'
        - '-q'
        - 'http://{{ include "drawio-agent.fullname" . }}-frontend:8080/draw/js/PreConfig.js'
    - name: curl-api
      image: alpine
      command: ['sh', '-c']
      args:
        - 'apk add --no-cache curl && curl -f http://{{ include "drawio-agent.fullname" . }}-api:3000/health'
  restartPolicy: Never

{{- if and .Values.metrics.enabled .Values.grafana.dashboards.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "drawio-agent.fullname" . }}-api-health-dashboard
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  api-health.json: |-
{{ .Files.Get "dashboards/api-health.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "drawio-agent.fullname" . }}-agent-perf-dashboard
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  agent-performance.json: |-
{{ .Files.Get "dashboards/agent-performance.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "drawio-agent.fullname" . }}-system-overview-dashboard
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  system-overview.json: |-
{{ .Files.Get "dashboards/system-overview.json" | indent 4 }}
{{- end }}

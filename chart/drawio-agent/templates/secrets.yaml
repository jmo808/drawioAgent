{{- if not .Values.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "drawio-agent.fullname" . }}-secrets
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ .Values.global.apiKey | b64enc | quote }}
  llm-provider: {{ .Values.agent.llm.provider | b64enc | quote }}
  llm-model: {{ .Values.agent.llm.model | b64enc | quote }}
  llm-api-key: {{ .Values.agent.llm.apiKey | b64enc | quote }}
{{- end }}

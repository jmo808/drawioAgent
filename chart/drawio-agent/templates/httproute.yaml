apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "drawio-agent.fullname" . }}
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
  {{- if .Values.httproute.annotations }}
  annotations:
    {{- toYaml .Values.httproute.annotations | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      {{- if .Values.gateway.namespace }}
      namespace: {{ .Values.gateway.namespace }}
      {{- end }}
      {{- if .Values.gateway.sectionName }}
      sectionName: {{ .Values.gateway.sectionName }}
      {{- end }}
  {{- if .Values.httproute.hostnames }}
  hostnames:
    {{- toYaml .Values.httproute.hostnames | nindent 4 }}
  {{- end }}
  rules:
    # 1. Agent providers route
    - matches:
        - path:
            type: Exact
            value: /api/v1/providers
      backendRefs:
        - name: {{ include "drawio-agent.fullname" . }}-agent
          port: 8000
    # 2. API routes (http & ws)
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "drawio-agent.fullname" . }}-api
          port: 3000
    # 3. Default route for frontend editor
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "drawio-agent.fullname" . }}-frontend
          port: 8080

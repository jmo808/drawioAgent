apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "drawio-agent.fullname" . }}
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
  {{- if .Values.httproute.hostnames }}
  hostnames:
    {{- toYaml .Values.httproute.hostnames | nindent 4 }}
  {{- end }}
  rules:
    # 1. API routes
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "drawio-agent.fullname" . }}-api
          port: 3000
    # 2. WebSocket chat route
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - name: {{ include "drawio-agent.fullname" . }}-api
          port: 3000
    # 3. Default route for frontend editor
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "drawio-agent.fullname" . }}-frontend
          port: 8080

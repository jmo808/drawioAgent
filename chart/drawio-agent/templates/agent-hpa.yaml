{{- if .Values.hpa.agent.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "drawio-agent.fullname" . }}-agent
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "drawio-agent.fullname" . }}-agent
  minReplicas: {{ .Values.hpa.agent.minReplicas }}
  maxReplicas: {{ .Values.hpa.agent.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.agent.targetCPU }}
{{- end -}}

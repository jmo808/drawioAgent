{{- if and .Values.collaboration.enabled .Values.collaboration.valkey.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "drawio-agent.fullname" . }}-valkey
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: valkey
      protocol: TCP
      name: valkey
  selector:
    {{- include "drawio-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
{{- end }}

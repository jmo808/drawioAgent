apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drawio-agent.fullname" . }}-agent
  labels:
    {{- include "drawio-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.agent.replicaCount }}
  selector:
    matchLabels:
      {{- include "drawio-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      {{- if .Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      {{- end }}
      labels:
        {{- include "drawio-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}{{ if .Values.agent.image.digest }}@{{ .Values.agent.image.digest }}{{ else }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
            - name: PYTHONPATH
              value: "/app/agent/src"
            - name: MCP_SERVER_PATH
              value: "/app/mcp-server/scripts/mcp-wrapper.js"
            - name: LLM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-secrets
                  key: llm-provider
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-secrets
                  key: llm-model
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "drawio-agent.fullname" . }}-secrets
                  key: llm-api-key
                  optional: true
            {{- if .Values.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.otlpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "{{ include "drawio-agent.fullname" . }}-agent"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}

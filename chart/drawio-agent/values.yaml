# Default values for drawio-agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

# Global settings
global:
  apiKey: "test-api-key"

# Draw.io Frontend settings
frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/jmo808/drawio-frontend
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Fastify API Server settings
api:
  replicaCount: 1
  image:
    repository: ghcr.io/jmo808/drawio-api
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Python AI Agent settings
agent:
  replicaCount: 1
  image:
    repository: ghcr.io/jmo808/drawio-agent
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  # LLM Provider Configuration
  llm:
    # Set to true to prioritize local/self-hosted LLM (Ollama) to prevent accidental data leakage
    localDefault: true
    provider: "ollama"
    model: "llama3"
    apiKey: ""

# Authentication settings
auth:
  provider: "apikey" # apikey | oidc | both
  jwksUri: ""
  issuer: ""
  audience: "drawio-agent"

# Collaboration (Valkey) settings
collaboration:
  enabled: false
  # Valkey deployment configuration
  valkey:
    # When true, an internal Valkey deployment is created
    enabled: true
    # External Valkey host (used when enabled=false)
    host: "valkey-external"
    # External Valkey port
    port: 6379
    # Valkey password (if any)
    password: ""
    # Name of an existing Kubernetes Secret containing Valkey password
    existingSecret: ""
    # Secret key containing Valkey password
    existingSecretKey: "password"
  # Valkey TLS/Encryption configuration
  tls:
    enabled: false
    # Secret name containing 'ca.crt', 'valkey.crt', and 'valkey.key'
    secretName: "valkey-tls-certs"
  # Valkey RDB persistence/snapshots configuration
  persistence:
    enabled: true
    # Snapshots save parameters (save <seconds> <changes>)
    saveIntervals: "900 1 300 10"
    # PVC size
    size: "1Gi"
    # Storage class name (leave empty for default)
    storageClass: ""
    # PVC Access mode
    accessMode: "ReadWriteOnce"

# Gateway API routing settings
gateway:
  # When true, a Gateway resource will be created
  enabled: true
  name: "drawio-gateway"
  gatewayClassName: "cilium"
  # TLS/HTTPS configuration for external ingress
  tls:
    enabled: false
    # Secret name containing 'tls.crt' and 'tls.key'
    secretName: "drawio-gateway-tls"

httproute:
  # Hostnames to match (e.g. ["drawio.example.com"])
  hostnames: []

# mTLS Configuration Example (API-to-Agent)
# To secure internal pod-to-pod communication between API and Agent:
# api:
#   tls:
#     enabled: true
#     clientCertSecret: "api-client-tls" # Contains client cert/key
# agent:
#   tls:
#     enabled: true
#     serverCertSecret: "agent-server-tls" # Contains server cert/key
#     clientCASecret: "agent-client-ca"    # CA to verify API clients


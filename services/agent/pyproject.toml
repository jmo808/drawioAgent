[project]
name = "drawio-agent"
version = "0.1.0"
description = "AI Agent Orchestration service for Draw.io diagrams"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "litellm>=1.34.0",
    "pydantic>=2.6.4",
    "httpx>=0.27.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=html"
testpaths = [
    "tests"
]
asyncio_mode = "auto"

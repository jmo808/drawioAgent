[project]
name = "drawio-agent"
version = "0.1.0"
description = "AI Agent Orchestration service for Draw.io diagrams"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "litellm>=1.34.0",
    "pydantic>=2.6.4",
    "httpx>=0.27.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "orjson>=3.10.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "pybreaker>=1.4.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24.0"
]


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=html"
testpaths = [
    "tests"
]
asyncio_mode = "auto"
